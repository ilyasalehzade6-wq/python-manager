<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0A0A0F">
    <title>ورود — پورتال اعضا</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

<style id="apk-btn-style">
/* 📱 دکمه دانلود اپلیکیشن — دائمی */
.apk-download-btn {
    position: fixed !important;
    bottom: 20px !important;
    left: 20px !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    background: linear-gradient(135deg, #f1c40f, #e67e22) !important;
    color: #0f0f1a !important;
    padding: 12px 22px !important;
    border-radius: 30px !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    text-decoration: none !important;
    box-shadow: 0 8px 25px rgba(241,196,15,0.5) !important;
    z-index: 2147483647 !important;
    font-family: inherit !important;
    direction: rtl !important;
    border: 2px solid rgba(241,196,15,0.8) !important;
    animation: apk-bounce 3s infinite !important;
}
.apk-download-btn:hover {
    transform: translateY(-3px) scale(1.05) !important;
}
@keyframes apk-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}
.apk-icon { font-size: 20px !important; }
@media (max-width: 600px) {
    .apk-download-btn {
        bottom: 15px !important;
        left: 15px !important;
        padding: 10px 16px !important;
        font-size: 13px !important;
    }
    .apk-text { display: none !important; }
    .apk-icon { font-size: 24px !important; }
}
</style>
</head>
<body>

<div class="auth-container">
    <!-- کارت ورود -->
    <div class="auth-card">
        
        <!-- هدر -->
        <div class="auth-header">
            <div class="brand-logo">💎</div>
            <h1 class="brand-name">پالس مدیریت</h1>
            <p class="brand-subtitle">پورتال اعضا</p>
        </div>

        <!-- فرم ورود -->
        <form id="loginForm" class="auth-form">
            
            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">📱</span>
                    شماره موبایل
                </label>
                <input 
                    type="tel" 
                    id="phone" 
                    class="form-input" 
                    placeholder="09123456789"
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">👤</span>
                    نام و نام خانوادگی
                </label>
                <input
                    type="text"
                    id="fullName"
                    class="form-input"
                    placeholder="مثلاً: علی محمدی"
                    autocomplete="name"
                    required
                >
                <div class="form-hint">
                    دقیقاً همان نامی که در باشگاه ثبت شده
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">🏢</span>
                    نام آموزشگاه / باشگاه
                </label>
                <input
                    type="text"
                    id="clubName"
                    class="form-input"
                    placeholder="مثلاً: باشگاه ستارگان"
                    autocomplete="organization"
                    required
                >
                <div class="form-hint">
                    نام باشگاهی که در آن ثبت‌نام کرده‌اید
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                <span class="btn-text">ورود به پورتال</span>
                <span class="spinner" style="display: none;"></span>
            </button>

            <div class="error-message" id="errorMsg"></div>

        </form>

        <!-- راهنما -->
        <div class="auth-footer">
            <p class="hint-text">
                ❓ در ورود مشکل دارید؟
            </p>
            <a href="#" class="help-link" onclick="contactSupport()">
                تماس با پشتیبانی
            </a>
        </div>

    </div>

    <!-- نسخه -->
    <div class="version-footer">
        <span>پالس مدیریت — نسخه <span id="version"></span></span>
    </div>
</div>

<!-- Supabase SDK -->
<script src="js/license-utils.js?v=20261012001006"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=20261012001006"></script>

<!-- App -->
<script src="js/config.js?v=20261012001006"></script>
<script src="js/auth.js?v=20261012001006"></script>

<script>
    document.getElementById('version').textContent = APP_VERSION;
</script>


<!-- Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .then(reg => {
          console.log('✅ SW registered:', reg.scope);
        })
        .catch(err => {
          console.warn('⚠️ SW registration failed:', err);
        });
    });
  }
</script>

<script id="apk-btn-script">
// 📱 دکمه دانلود APK — تضمین می‌کنه همیشه هست
(function() {
    'use strict';

    function createButton() {
        const btn = document.createElement('a');
        btn.href = 'downloads/PulsePortal.apk';
        btn.setAttribute('download', '');
        btn.className = 'apk-download-btn';
        btn.title = 'دانلود اپلیکیشن موبایل';
        btn.innerHTML = '<span class="apk-icon">📱</span><span class="apk-text">نصب اپلیکیشن</span>';
        return btn;
    }

    function ensureButton() {
        if (!document.body) return;
        if (document.querySelector('.apk-download-btn')) return;

        // اطمینان از اینکه CSS هست
        if (!document.getElementById('apk-btn-style')) {
            const style = document.createElement('style');
            style.id = 'apk-btn-style';
            style.textContent = document.getElementById('apk-btn-style-template')?.textContent || '';
        }

        document.body.appendChild(createButton());
    }

    // اجرا در چند مرحله
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureButton);
    } else {
        ensureButton();
    }

    // پیگیری دائمی — هر ۵۰۰ms چک کن
    setInterval(ensureButton, 500);

    // MutationObserver: اگه دکمه پاک شد، فوراً اضافه کن
    if (typeof MutationObserver !== 'undefined') {
        const observer = new MutationObserver(function(mutations) {
            if (!document.querySelector('.apk-download-btn')) {
                ensureButton();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (document.body) {
                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                });
            }
        });
    }

    console.log('✅ APK button script loaded');
})();
</script>

</body>
</html>
