<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود — پورتال اعضا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #09090b; color: #fff; }
        .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-message { display: none; }
        .error-message.show { display: block; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Background Gradient -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-[400px] h-[400px] bg-amber-500/5 rounded-full blur-[80px]"></div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-sm mx-4 bg-[#121215] border border-zinc-800 rounded-2xl p-6 shadow-2xl shadow-black/50 relative z-10" id="authCard">
        
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-zinc-800 rounded-xl flex items-center justify-center mb-4 mx-auto border border-zinc-700">
                <i data-lucide="activity" class="w-6 h-6 text-amber-500 stroke-[1.5]"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight mb-1">پورتال اعضا</h1>
            <p class="text-xs text-zinc-400">پالس مدیریت</p>
        </div>

        <form id="loginForm" class="flex flex-col gap-4">
            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">شماره موبایل</label>
                <input type="tel" id="phone" class="w-full bg-[#09090b] border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all text-left font-mono" placeholder="09123456789" maxlength="11" inputmode="numeric" required>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">نام و نام خانوادگی</label>
                <input type="text" id="fullName" class="w-full bg-[#09090b] border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all" placeholder="مثلاً: علی محمدی" required>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">نام باشگاه</label>
                <input type="text" id="clubName" class="w-full bg-[#09090b] border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all" placeholder="مثلاً: باشگاه ستارگان" required>
            </div>

            <div id="errorMsg" class="error-message bg-red-500/10 border border-red-500/20 text-red-500 text-xs rounded-lg p-2.5 text-center mt-2"></div>

            <button type="submit" id="loginBtn" class="w-full mt-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold rounded-lg py-2.5 flex items-center justify-center gap-2 transition-all shadow-lg shadow-amber-500/20 text-sm">
                <i data-lucide="log-in" class="w-4 h-4 stroke-[2]"></i>
                <span class="btn-text">ورود به پورتال</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="border-t border-zinc-800 my-5"></div>

        <div class="text-center">
            <a href="#" onclick="contactSupport()" class="text-xs text-amber-500 hover:bg-amber-500/10 px-3 py-1.5 rounded-lg transition-colors inline-flex items-center gap-1.5">
                <i data-lucide="headphones" class="w-3.5 h-3.5 stroke-[1.5]"></i>
                پشتیبانی
            </a>
        </div>
    </div>

    <div class="absolute bottom-6 text-center w-full z-10">
        <span class="text-[10px] text-zinc-600">پالس مدیریت — نسخه <span id="version">1.0.0</span></span>
    </div>

    <script src="js/license-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=1793903649730"></script>
    <script src="js/auth.js?v=1793903649730"></script>
    <script>
        lucide.createIcons();
        document.getElementById('version').textContent = APP_VERSION;
    </script>
</body>
</html>
