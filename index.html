<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0A0A0F">
    <title>ورود — پورتال اعضا</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

<style>
.apk-download-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #f1c40f, #e67e22);
    color: #0f0f1a;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(241,196,15,0.4);
    z-index: 9998;
    transition: all 0.3s;
    font-family: inherit;
    direction: rtl;
}
.apk-download-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(241,196,15,0.6);
}
.apk-icon {
    font-size: 20px;
}
@media (max-width: 600px) {
    .apk-download-btn {
        bottom: 15px;
        left: 15px;
        padding: 10px 16px;
        font-size: 13px;
    }
    .apk-text {
        display: none;
    }
    .apk-icon {
        font-size: 24px;
    }
}
</style>

</head>
<body>

<div class="auth-container">
    <!-- کارت ورود -->
    <div class="auth-card">
        
        <!-- هدر -->
        <div class="auth-header">
            <div class="brand-logo">💎</div>
            <h1 class="brand-name">پالس مدیریت</h1>
            <p class="brand-subtitle">پورتال اعضا</p>
        </div>

        <!-- فرم ورود -->
        <form id="loginForm" class="auth-form">
            
            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">📱</span>
                    شماره موبایل
                </label>
                <input 
                    type="tel" 
                    id="phone" 
                    class="form-input" 
                    placeholder="09123456789"
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">👤</span>
                    نام و نام خانوادگی
                </label>
                <input
                    type="text"
                    id="fullName"
                    class="form-input"
                    placeholder="مثلاً: علی محمدی"
                    autocomplete="name"
                    required
                >
                <div class="form-hint">
                    دقیقاً همان نامی که در باشگاه ثبت شده
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">🏢</span>
                    نام آموزشگاه / باشگاه
                </label>
                <input
                    type="text"
                    id="clubName"
                    class="form-input"
                    placeholder="مثلاً: باشگاه ستارگان"
                    autocomplete="organization"
                    required
                >
                <div class="form-hint">
                    نام باشگاهی که در آن ثبت‌نام کرده‌اید
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                <span class="btn-text">ورود به پورتال</span>
                <span class="spinner" style="display: none;"></span>
            </button>

            <div class="error-message" id="errorMsg"></div>

        </form>

        <!-- راهنما -->
        <div class="auth-footer">
            <p class="hint-text">
                ❓ در ورود مشکل دارید؟
            </p>
            <a href="#" class="help-link" onclick="contactSupport()">
                تماس با پشتیبانی
            </a>
        </div>

    </div>

    <!-- نسخه -->
    <div class="version-footer">
        <span>پالس مدیریت — نسخه <span id="version"></span></span>
    </div>
</div>

<!-- Supabase SDK -->
<script src="js/license-utils.js?v=20261011235511"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=20261011235511"></script>

<!-- App -->
<script src="js/config.js?v=20261011235511"></script>
<script src="js/auth.js?v=20261011235511"></script>

<script>
    document.getElementById('version').textContent = APP_VERSION;
</script>


<!-- Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .then(reg => {
          console.log('✅ SW registered:', reg.scope);
        })
        .catch(err => {
          console.warn('⚠️ SW registration failed:', err);
        });
    });
  }
</script>


<!-- 📱 دکمه دانلود اپلیکیشن -->
<a href="downloads/PulsePortal.apk" 
   class="apk-download-btn" 
   download
   title="دانلود اپلیکیشن موبایل">
    <span class="apk-icon">📱</span>
    <span class="apk-text">نصب اپلیکیشن</span>
</a>

</body>
</html>
